name: API

# The shop's API lives in server/. When it changes, this tests it against a
# real MariaDB and then publishes the folder, on its own, to the branch
# "api". SiteGround's Node.js project is linked to that branch and redeploys
# on every push to it (see server/README.md).

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: machiko_test
          MARIADB_USER: machiko
          MARIADB_PASSWORD: machiko
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: mysql://machiko:machiko@127.0.0.1:3306/machiko_test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish server/ to the api branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix server -b api-publish
          git push --force origin api-publish:api

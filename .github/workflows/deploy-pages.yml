name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
    # pictures for social media do not change the site
    paths-ignore: ['social/**', 'shop/**', 'scripts/shots.mjs', '.github/workflows/shots.yml', '.github/workflows/shop.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Photographs: fetched once, then kept between runs until the list changes.
      - uses: actions/cache@v4
        with:
          path: |
            public/photos
            src/data/photos.manifest.json
          key: photos-${{ hashFiles('src/data/images.js', 'scripts/photos.mjs') }}
      - run: npm run photos
      - name: Build the preview
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # The repo is served under /matcha-shop/ on github.io.
          export VITE_BASE=/matcha-shop/ VITE_SITE_URL=https://daduckdivedev.github.io/matcha-shop
          if [ -n "$API_URL" ]; then export VITE_API_URL="$API_URL"; fi
          npm run build
      # GitHub Pages serves 404.html for unknown paths; the app routes from there.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo the first time (source: GitHub Actions).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
